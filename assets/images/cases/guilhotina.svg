<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">LG Safety</title>
  <desc id="desc">Imagem ilustrativa de apoio para o site da LG Safety.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" x2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect x="120" y="120" width="960" height="660" rx="28" fill="#0f172a" stroke="#fbbf24" stroke-width="8"/>
  <rect x="200" y="220" width="800" height="160" rx="18" fill="url(#amber)" opacity="0.95"/>
  <text x="600" y="315" text-anchor="middle" font-size="72" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#111827">LG SAFETY</text>
  <rect x="220" y="430" width="240" height="230" rx="20" fill="#d1d5db"/>
  <rect x="500" y="430" width="240" height="230" rx="20" fill="#f3f4f6"/>
  <rect x="780" y="430" width="200" height="230" rx="20" fill="#fbbf24"/>
  <text x="600" y="620" text-anchor="middle" font-size="46" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#f5f5f5">GUILHOTINA</text>
</svg>
